plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ing.zort'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.pinnednotifications"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
